server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Branded "open from inSight" page. Used both as the portal-gate 403 page
    # and as the redirect target when the client-side JWT gate finds no valid
    # token. Exempt from the gate (exact-match location) and self-contained (no
    # external assets) so it always renders and can't loop.
    error_page 403 /denied.html;
    location = /denied.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Compress API JSON (a 10k-row log response is ~3 MB and shrinks ~10x), so
    # large/concurrent log fetches transfer fast.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    location / {
        # The backend approves the request (portal referrer / same-host)
        # before any UI file is served.
        auth_request /__portal_gate;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location = /__portal_gate {
        internal;
        proxy_pass http://backend:3001/api/portal-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        # Forward the original navigation's signals so the backend can decide
        # whether the visit really started from the portal.
        proxy_set_header Referer $http_referer;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
