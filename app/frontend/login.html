<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · TA9 Service Center</title>
    <link rel="icon" type="image/png" href="ta9_logo.png">
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.07) 0, rgba(255, 255, 255, 0.07) 1px, transparent 1px, transparent 24px),
                linear-gradient(135deg, #050507 0%, #45454f 40%, #161619 68%, #50505c 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 14px;
            padding: 36px 32px 30px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        }

        .login-logo {
            display: block;
            height: 52px;
            width: auto;
            margin: 0 auto 14px;
        }

        .login-card h1 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cfd6ea;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button.login-btn {
            width: 100%;
            margin-top: 6px;
            padding: 12px 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
        }

        button.login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        }

        button.login-btn:disabled { opacity: 0.6; cursor: default; }

        .login-error {
            display: none;
            margin-top: 16px;
            padding: 10px 12px;
            border-left: 4px solid #f44336;
            background: #fff5f5;
            color: #b91c1c;
            font-size: 13px;
            border-radius: 6px;
        }
        .login-error.show { display: block; }
    </style>
</head>
<body>
    <form class="login-card" id="loginForm" autocomplete="on">
        <img src="ta9_logo.png" alt="TA9" class="login-logo">
        <h1>Service Center</h1>
        <p class="subtitle">Sign in to access the monitor</p>

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Sign in</button>

        <div class="login-error" id="loginError"></div>
    </form>

    <script>
        // Already signed in with a valid token? Skip straight to the monitor.
        if (window.Auth && Auth.isValid()) {
            window.location.replace(Auth.APP_PAGE);
        }

        var form = document.getElementById('loginForm');
        var btn = document.getElementById('loginBtn');
        var errorBox = document.getElementById('loginError');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorBox.classList.remove('show');

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            if (!username || !password) {
                showError('Please enter your username and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            try {
                await Auth.login(username, password);
                window.location.replace(Auth.APP_PAGE);
            } catch (err) {
                showError(err && err.message ? err.message : 'Unable to sign in. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
